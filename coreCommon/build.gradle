plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'mxchip-router'
}

// 应用通用模块配置
apply from: '../build-modules-common.gradle'

android {
    namespace "com.mxchip.mxapp.base"
}

dependencies {
    implementation libs.appcompat
    implementation libs.coreKtx
    implementation libs.constraintLayout
    implementation libs.material
    implementation libs.lifecycleRunTimeKtx
    implementation libs.lottie
    implementation libs.zip4j
    api files('../libs/apicore-release.aar')
    api libs.swiperefreshlayout
    api libs.pagingKtx

    api libs.qrScan
    api libs.moshiKotlin
    api libs.mmkv
    api libs.coil
    api libs.permission
    api libs.mxHttp
    api libs.mxLog
    api libs.mxScanner
    api libs.mxMesh
    api libs.mxMeshRule
    api libs.mxUtils
}